name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  test:
    # frappe v15 runs on 3.11 and v16 on 3.14; the tool installs next to either.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Test with coverage
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage, Python ${{ matrix.python }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
