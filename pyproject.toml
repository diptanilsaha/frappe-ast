[project]
name = "frappe-ast"
version = "0.2.3"
description = "Static AST index for Frappe benches: index, trace and check Python, JS and Vue code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
frappe-ast = "frappe_ast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frappe_ast"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/bench"]  # the synthetic bench: app code with deliberate mistakes

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["W191", "E101", "E501", "B905"]

[tool.ruff.format]
indent-style = "tab"
